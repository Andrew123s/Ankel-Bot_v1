<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ankel-Bot — Engineering Visualisation</title>
<style>
  :root { --bg:#14171b; --panel:#1b1f25; --line:#2c323a; --ink:#e7eaee; --dim:#98a1ad; --acc:#12a898; --ok:#39d98a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }
  #side { width:320px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #side header { padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  #side h1 { margin:0; font-size:19px; letter-spacing:.06em; }
  #side h1 span { color:var(--acc); }
  #side header p { margin:4px 0 0; color:var(--dim); font-size:12px; }
  #cats { list-style:none; margin:0; padding:8px; border-bottom:1px solid var(--line); }
  #cats li { display:flex; gap:10px; align-items:center; padding:6px 10px; border-radius:6px; cursor:pointer; color:var(--dim); }
  #cats li:hover { background:#232830; color:var(--ink); }
  #cats li.on { background:#2a2f38; color:var(--ink); }
  #cats li b { flex:none; width:20px; height:20px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:11px; font-weight:600; }
  #cats li.on b { background:var(--acc); border-color:var(--acc); color:#fff; }
  #cats li.done b { border-color:var(--ok); color:var(--ok); }
  #info { padding:14px 18px; overflow:auto; flex:1; min-height:0; }
  #info h2 { margin:0 0 6px; font-size:14px; }
  #info p { margin:0 0 10px; color:#c3c9d1; }
  #info ul { margin:0 0 10px; padding-left:16px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #info .parts { color:var(--dim); font-size:12px; }
  #info button { margin-top:4px; }
  #view { position:relative; flex:1; min-width:0; }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .label { position:absolute; transform:translate(-50%,-130%); white-space:nowrap; padding:2px 8px; border-radius:10px; background:rgba(18,21,25,.86); border:1px solid #3a424c; font-size:11px; color:#e7eaee; }
  .label::after { content:""; position:absolute; left:50%; bottom:-7px; width:1px; height:7px; background:#8a94a0; }
  .label.dim { background:rgba(18,168,152,.94); border-color:transparent; color:#fff; font-weight:600; }
  button, .tab { font:inherit; color:var(--ink); background:#262b33; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover, .tab:hover { background:#303640; }
  #modes { position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:4px; background:rgba(27,31,37,.92); border:1px solid var(--line); border-radius:9px; }
  #modes .tab { border-color:transparent; background:transparent; color:var(--dim); white-space:nowrap; }
  #modes .tab.on { background:var(--acc); color:#fff; }
  #views { position:absolute; top:60px; left:14px; display:flex; gap:4px; }
  #views button { padding:4px 9px; font-size:12px; }
  #ctx { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); max-width:calc(100% - 32px); background:rgba(27,31,37,.94); border:1px solid var(--line); border-radius:10px; padding:10px 14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  #ctx label { display:flex; gap:6px; align-items:center; color:var(--dim); white-space:nowrap; }
  #ctx input[type=range] { width:170px; accent-color:var(--acc); }
  #ctx input[type=checkbox] { accent-color:var(--acc); }
  #ctx .cap { max-width:430px; }
  #ctx .cap b { display:block; }
  #ctx .cap span { color:var(--dim); font-size:12px; }
  #hud { position:absolute; top:60px; right:14px; z-index:2; width:232px; background:rgba(27,31,37,.92); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-variant-numeric:tabular-nums; display:none; }
  #hud .st { font-weight:700; color:var(--ok); letter-spacing:.04em; margin-bottom:6px; }
  #hud .row { display:flex; justify-content:space-between; color:var(--dim); }
  #hud .row b { color:var(--ink); font-weight:600; }
  #hud .bar { height:5px; background:#2c323a; border-radius:3px; margin:3px 0 7px; overflow:hidden; }
  #hud .bar i { display:block; height:100%; background:var(--acc); }
  #pip { position:absolute; right:14px; bottom:16px; width:300px; height:169px; border:1px solid #55606c; border-radius:4px; overflow:hidden; display:none; pointer-events:none; }
  #pip .tag { position:absolute; left:6px; top:4px; font:600 10px/1 Consolas,monospace; color:#fff; text-shadow:0 0 3px #000; }
  #pip .rec { position:absolute; right:6px; top:4px; font:600 10px/1 Consolas,monospace; color:#ff5a4a; text-shadow:0 0 3px #000; }
  .det { position:absolute; border:1.5px solid #39d98a; font:600 9px/1 Consolas,monospace; color:#04130b; }
  .det span { position:absolute; left:-1.5px; bottom:100%; background:#39d98a; padding:1px 3px; white-space:nowrap; }
  .det.tgt { border-color:#ffb020; } .det.tgt span { background:#ffb020; }
  @media (max-width:860px) {
    #app { flex-direction:column-reverse; }
    #side { width:auto; height:38%; border-right:0; border-top:1px solid var(--line); }
    #side header { display:none; }
    #cats { display:flex; overflow-x:auto; } #cats li span { display:none; }
    #modes { left:8px; right:8px; transform:none; overflow-x:auto; } #views { top:58px; left:8px; }
    #hud { top:92px; width:200px; } #pip { width:200px; height:113px; bottom:84px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>ANKEL<span>-BOT</span></h1>
      <p>Autonomous surface waste collector · engineering model, scale 1:1 (metres)</p>
    </header>
    <ol id="cats"></ol>
    <div id="info"></div>
  </aside>
  <main id="view">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <nav id="modes">
      <button class="tab" data-m="assembled">Assembled</button>
      <button class="tab" data-m="assembly">Build sequence</button>
      <button class="tab" data-m="exploded">Exploded</button>
      <button class="tab" data-m="internal">Internal</button>
      <button class="tab" data-m="operation">Operation</button>
    </nav>
    <div id="views">
      <button data-v="iso">Iso</button><button data-v="top">Top</button><button data-v="side">Side</button><button data-v="front">Front</button><button data-v="rear">Rear</button>
    </div>
    <div id="hud"></div>
    <div id="pip"><div class="tag">CAM-01 · on-board detector</div><div class="rec">● LIVE</div></div>
    <div id="ctx"></div>
  </main>
</div>
<script src="vendor/three.min.js"></script>
<script src="src/model.js"></script>
<script src="src/app.js"></script>
</body>
</html>
